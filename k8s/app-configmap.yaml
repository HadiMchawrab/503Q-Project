apiVersion: v1
kind: ConfigMap
metadata:
  name: shopcloud-config
data:
  APP_ENV: "production"
  CATALOG_SERVICE_URL: "http://catalog:3001"
  CART_SERVICE_URL: "http://cart:3002"
  CHECKOUT_SERVICE_URL: "http://checkout:3003"
  AUTH_SERVICE_URL: "http://auth:3004"
  ADMIN_SERVICE_URL: "http://admin:3005"
  AWS_REGION: "eu-west-1"
  # INVOICE_QUEUE_URL is set per-environment via the kustomize overlay
  # (terraform output -raw invoice_queue_url).
  # Cognito values come from terraform outputs and are merged in by the overlay.
  # Empty here so the base manifest is environment-agnostic; overlay overrides.
  COGNITO_USER_POOL_ID: ""
  COGNITO_ADMIN_POOL_ID: ""
  COGNITO_CLIENT_ID: ""
  COGNITO_ADMIN_CLIENT_ID: ""
  COGNITO_CUSTOMER_DOMAIN: ""
  COGNITO_ADMIN_DOMAIN: ""
