apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  labels:
    app: admin
    app.kubernetes.io/name: admin
    app.kubernetes.io/component: admin
    app.kubernetes.io/managed-by: kustomize
  annotations:
    shopcloud.io/owner: platform-team
spec:
  replicas: 2
  selector:
    matchLabels: { app: admin }
  template:
    metadata:
      labels:
        app: admin
        app.kubernetes.io/name: admin
        app.kubernetes.io/component: admin
        app.kubernetes.io/managed-by: kustomize
    spec:
      containers:
        - name: admin
          image: shopcloud-app:latest
          command: ["uvicorn", "services.admin.main:app", "--host", "0.0.0.0", "--port", "3005"]
          ports:
            - containerPort: 3005
          env:
            - name: PORT
              value: "3005"
            - name: ROOT_PATH
              value: /api/admin
          envFrom:
            - configMapRef: { name: shopcloud-config }
            - secretRef: { name: shopcloud-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 3005 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3005 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  labels:
    app: admin
    app.kubernetes.io/name: admin
    app.kubernetes.io/component: admin
    app.kubernetes.io/managed-by: kustomize
  annotations:
    shopcloud.io/owner: platform-team
spec:
  selector: { app: admin }
  ports:
    - port: 3005
      targetPort: 3005
