apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Per-environment overlays set the namespace and override the image tag.
# Do not set `namespace:` or `images:` here — overlays own those.

commonLabels:
  app.kubernetes.io/part-of: shopcloud

resources:
  - app-configmap.yaml
  - secrets.yaml
  - auth.yaml
  - catalog.yaml
  - cart.yaml
  - checkout.yaml
  - admin.yaml
  - admin-ui.yaml
  - ingress.yaml
  - ingress-admin.yaml
  - hpa.yaml
  - keda-invoice-scaler.yaml
  - invoice-worker.yaml
