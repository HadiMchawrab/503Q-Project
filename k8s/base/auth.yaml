apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app: auth
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: identity
    app.kubernetes.io/managed-by: kustomize
  annotations:
    shopcloud.io/owner: platform-team
spec:
  replicas: 2
  selector:
    matchLabels: { app: auth }
  template:
    metadata:
      labels:
        app: auth
        app.kubernetes.io/name: auth
        app.kubernetes.io/component: identity
        app.kubernetes.io/managed-by: kustomize
    spec:
      containers:
        - name: auth
          image: shopcloud-app:latest
          command: ["uvicorn", "services.auth.main:app", "--host", "0.0.0.0", "--port", "3004"]
          ports:
            - containerPort: 3004
          env:
            - name: PORT
              value: "3004"
            - name: ROOT_PATH
              value: /api/auth
          envFrom:
            - configMapRef: { name: shopcloud-config }
            - secretRef: { name: shopcloud-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 3004 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3004 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  labels:
    app: auth
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: identity
    app.kubernetes.io/managed-by: kustomize
  annotations:
    shopcloud.io/owner: platform-team
spec:
  selector: { app: auth }
  ports:
    - port: 3004
      targetPort: 3004
