# KEDA ScaledObject — scales the invoice-worker Deployment based on SQS queue depth.
# Requires KEDA installed in the cluster (kedacore/keda Helm chart).
#
# The Deployment lives in invoice-worker.yaml; both reference the same
# `invoice-worker` ServiceAccount (defined below) which the prod overlay
# annotates with the IRSA role ARN exported as `invoice_worker_irsa_role_arn`.
#
# Production note: the Lambda at modules/lambda is still wired to SQS via an
# event source mapping. Don't run BOTH consumers at once on the same queue;
# disable one before enabling the other.
#
# The queueURL field below is a placeholder; the per-env kustomize overlay
# patches it from the `invoice_queue_url` Terraform output.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: invoice-worker
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: invoice-worker-aws
spec:
  podIdentity:
    provider: aws-eks   # uses IRSA on the invoice-worker ServiceAccount
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: invoice-worker
spec:
  scaleTargetRef:
    name: invoice-worker
  minReplicaCount: 0
  maxReplicaCount: 20
  pollingInterval: 15
  cooldownPeriod: 60
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: invoice-worker-aws
      metadata:
        queueURL: PLACEHOLDER_SET_BY_OVERLAY
        queueLength: "5"
        awsRegion: eu-west-1
