# Base Secret — placeholder; real values are merged in by deploy.yml via the
# overlay's secretGenerator (behavior: merge).
#
# DATABASE_URL: per-env (shopcloud_prod / shopcloud_dev on the same RDS).
# REDIS_URL: env-agnostic ElastiCache primary endpoint (carts are namespaced
# via CART_KEY_PREFIX in shopcloud-config so dev and prod don't collide).
#
# Both values are written by deploy.yml — do not put real defaults here.
apiVersion: v1
kind: Secret
metadata:
  name: shopcloud-secrets
type: Opaque
stringData: {}
