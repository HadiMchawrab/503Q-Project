# Base Secret — placeholder values only.
#
# DATABASE_URL is intentionally NOT set here. Each overlay (k8s/overlays/<env>)
# generates its own Secret with the env-specific URL via secretGenerator + merge.
# That keeps real passwords out of git and lets dev and prod point at different
# Postgres databases on the same RDS instance.
#
# REDIS_URL is shared today; carts are namespaced by CART_KEY_PREFIX (set in
# shopcloud-config) so dev and prod don't collide on the same Redis instance.
apiVersion: v1
kind: Secret
metadata:
  name: shopcloud-secrets
type: Opaque
stringData:
  REDIS_URL: "redis://redis:6379"
