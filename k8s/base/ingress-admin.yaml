# Admin ingress — internal ALB, no public DNS record.
# Reachable only from the corporate network via Client VPN (see infra/terraform/modules/vpn).
# The AWS Load Balancer Controller provisions a separate ALB because alb.ingress.kubernetes.io/group.name
# is not set the same as the public ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopcloud-admin
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  rules:
    - http:
        paths:
          # Admin REST API
          - path: /api/admin
            pathType: Prefix
            backend:
              service:
                name: admin
                port: { number: 3005 }
          # Auth endpoints used by the admin console (/config, /me, and in
          # local-dev mode /login). The customer-facing public ALB has its own
          # copy of this route — they reach the same auth Service.
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth
                port: { number: 3004 }
          # Admin console static assets (index.html, admin.js, cognito.js, css).
          # Must be last so it acts as the catch-all.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-ui
                port: { number: 80 }
