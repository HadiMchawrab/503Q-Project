# Horizontal Pod Autoscalers — one per HTTP service.
# Scales between 2 and 6 replicas based on CPU. Cluster Autoscaler grows the
# node group when pods can't be scheduled.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalog
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalog
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
