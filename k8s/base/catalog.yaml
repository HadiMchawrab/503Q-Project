apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  labels:
    app: catalog
    app.kubernetes.io/name: catalog
    app.kubernetes.io/component: catalog
    app.kubernetes.io/managed-by: kustomize
  annotations:
    shopcloud.io/owner: platform-team
spec:
  replicas: 2
  selector:
    matchLabels: { app: catalog }
  template:
    metadata:
      labels:
        app: catalog
        app.kubernetes.io/name: catalog
        app.kubernetes.io/component: catalog
        app.kubernetes.io/managed-by: kustomize
    spec:
      containers:
        - name: catalog
          image: shopcloud-app:latest
          command: ["uvicorn", "services.catalog.main:app", "--host", "0.0.0.0", "--port", "3001"]
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: ROOT_PATH
              value: /api/catalog
          envFrom:
            - configMapRef: { name: shopcloud-config }
            - secretRef: { name: shopcloud-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  labels:
    app: catalog
    app.kubernetes.io/name: catalog
    app.kubernetes.io/component: catalog
    app.kubernetes.io/managed-by: kustomize
  annotations:
    shopcloud.io/owner: platform-team
spec:
  selector: { app: catalog }
  ports:
    - port: 3001
      targetPort: 3001
