apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - namespace.yaml
  - ../../base

# CI replaces `newTag` with the short Git SHA before applying. ECR repos have
# image_tag_mutability=IMMUTABLE (see infra/terraform/modules/storage/main.tf),
# so `latest` is intentionally NOT used — it would be rejected on the second push.
# Run before kubectl apply:
#   kustomize edit set image shopcloud-app=$REG/shopcloud-app:$TAG
#   kustomize edit set image admin-ui=$REG/admin-ui:$TAG
#   kustomize edit set image invoice-worker=$REG/invoice-worker:$TAG
images:
  - name: shopcloud-app
    newName: REPLACE_WITH_ECR_URL/shopcloud-app
    newTag: placeholder-set-by-ci
  - name: admin-ui
    newName: REPLACE_WITH_ECR_URL/admin-ui
    newTag: placeholder-set-by-ci
  - name: invoice-worker
    newName: REPLACE_WITH_ECR_URL/invoice-worker
    newTag: placeholder-set-by-ci

# CART_KEY_PREFIX namespaces Redis keys per env. All other env-specific
# values (INVOICE_QUEUE_URL, Cognito IDs, INVOICES_BUCKET, SES_SENDER,
# DB_*) are filled by deploy.yml via `kustomize edit add configmap
# --from-literal=...`. Those keys must NOT be pre-listed here — kustomize
# edit cannot replace existing literals, only append, and a duplicate key
# causes the apply to fail with "illegally repeats the key".
configMapGenerator:
  - name: shopcloud-config
    behavior: merge
    literals:
      - "CART_KEY_PREFIX=cart:prod:"

# DATABASE_URL is generated here so the prod password never lives in git.
# CI runs: kustomize edit add secret shopcloud-secrets --from-literal=DATABASE_URL=$URL
secretGenerator:
  - name: shopcloud-secrets
    behavior: merge
    literals:
      - DATABASE_URL=REPLACE_WITH_TERRAFORM_OUTPUT_RDS_URL_PROD

# IRSA annotations on the service accounts that need AWS permissions.
patches:
  - path: checkout-sa-patch.yaml
    target:
      kind: ServiceAccount
      name: checkout
  - path: invoice-worker-sa-patch.yaml
    target:
      kind: ServiceAccount
      name: invoice-worker

# Production keeps the base default of 2 replicas per HTTP service.
