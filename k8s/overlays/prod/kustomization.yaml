apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - namespace.yaml
  - ../../base

# CI replaces `newTag` with the short Git SHA before applying. ECR repos have
# image_tag_mutability=IMMUTABLE (see infra/terraform/modules/storage/main.tf),
# so `latest` is intentionally NOT used — it would be rejected on the second push.
# Run before kubectl apply:
#   kustomize edit set image shopcloud-app=$REG/shopcloud-app:$TAG
#   kustomize edit set image admin-ui=$REG/admin-ui:$TAG
#   kustomize edit set image invoice-worker=$REG/invoice-worker:$TAG
images:
  - name: shopcloud-app
    newName: REPLACE_WITH_ECR_URL/shopcloud-app
    newTag: placeholder-set-by-ci
  - name: admin-ui
    newName: REPLACE_WITH_ECR_URL/admin-ui
    newTag: placeholder-set-by-ci
  - name: invoice-worker
    newName: REPLACE_WITH_ECR_URL/invoice-worker
    newTag: placeholder-set-by-ci

# Per-environment config overrides. CI fills the placeholders from terraform
# outputs before applying. CART_KEY_PREFIX namespaces Redis keys for prod;
# the DATABASE_URL in shopcloud-secrets points at the shopcloud_prod database.
configMapGenerator:
  - name: shopcloud-config
    behavior: merge
    literals:
      - INVOICE_QUEUE_URL=REPLACE_WITH_TERRAFORM_OUTPUT
      - CART_KEY_PREFIX=cart:prod:
      # invoice-worker reads these (mirror of the Lambda env). Filled in by CI:
      #   kustomize edit add configmap shopcloud-config \
      #     --from-literal=INVOICES_BUCKET=$(terraform output -raw invoice_bucket_name) \
      #     --from-literal=SES_SENDER=invoices@shopcloud.com \
      #     --from-literal=DB_HOST=$(terraform output -raw rds_endpoint) \
      #     --from-literal=DB_NAME=shopcloud_prod \
      #     --from-literal=DB_USER=shopcloud \
      #     --from-literal=DB_SECRET_ARN=$(terraform output -raw db_secret_arn)
      - INVOICES_BUCKET=REPLACE_WITH_TERRAFORM_OUTPUT
      - SES_SENDER=REPLACE_WITH_TERRAFORM_OUTPUT
      - DB_HOST=REPLACE_WITH_TERRAFORM_OUTPUT
      - DB_NAME=shopcloud_prod
      - DB_USER=shopcloud
      - DB_SECRET_ARN=REPLACE_WITH_TERRAFORM_OUTPUT

# DATABASE_URL is generated here so the prod password never lives in git.
# CI runs: kustomize edit add secret shopcloud-secrets --from-literal=DATABASE_URL=$URL
secretGenerator:
  - name: shopcloud-secrets
    behavior: merge
    literals:
      - DATABASE_URL=REPLACE_WITH_TERRAFORM_OUTPUT_RDS_URL_PROD

# IRSA annotations on the service accounts that need AWS permissions.
patches:
  - path: checkout-sa-patch.yaml
    target:
      kind: ServiceAccount
      name: checkout
  - path: invoice-worker-sa-patch.yaml
    target:
      kind: ServiceAccount
      name: invoice-worker

# Production keeps the base default of 2 replicas per HTTP service.
