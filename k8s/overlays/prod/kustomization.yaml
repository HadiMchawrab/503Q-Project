apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - namespace.yaml
  - ../../base

# CI replaces `newTag` with the short Git SHA before applying:
#   kustomize edit set image shopcloud-app=$REG/shopcloud-app:$TAG
images:
  - name: shopcloud-app
    newName: REPLACE_WITH_ECR_URL/shopcloud-app
    newTag: latest

# Set INVOICE_QUEUE_URL from terraform output. CI runs:
#   kustomize edit add configmap shopcloud-config --from-literal=INVOICE_QUEUE_URL=$URL
configMapGenerator:
  - name: shopcloud-config
    behavior: merge
    literals:
      - INVOICE_QUEUE_URL=REPLACE_WITH_TERRAFORM_OUTPUT

# IRSA annotation on the checkout service account.
patches:
  - path: checkout-sa-patch.yaml
    target:
      kind: ServiceAccount
      name: checkout

# Production keeps the base default of 2 replicas per HTTP service.
