apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - namespace.yaml
  - ../../base

# CI replaces `newTag` with the short Git SHA before applying.
# ECR is IMMUTABLE — `latest` is rejected on the second push, so always use a SHA.
#   kustomize edit set image shopcloud-app=$REG/shopcloud-app:$TAG
#   kustomize edit set image admin-ui=$REG/admin-ui:$TAG
images:
  - name: shopcloud-app
    newName: REPLACE_WITH_ECR_URL/shopcloud-app
    newTag: placeholder-set-by-ci
  - name: admin-ui
    newName: REPLACE_WITH_ECR_URL/admin-ui
    newTag: placeholder-set-by-ci

# Dev does NOT process invoices — leaving INVOICE_QUEUE_URL empty makes
# checkout's publish_invoice_event a no-op (see shared/queue.py).
# Avoids dev orders sending real emails through the prod SQS/Lambda/SES path.
configMapGenerator:
  - name: shopcloud-config
    behavior: merge
    literals:
      - INVOICE_QUEUE_URL=

patches:
  - path: checkout-sa-patch.yaml
    target:
      kind: ServiceAccount
      name: checkout

# Cheaper footprint in dev — single replica per service.
replicas:
  - { name: auth,     count: 1 }
  - { name: catalog,  count: 1 }
  - { name: cart,     count: 1 }
  - { name: checkout, count: 1 }
  - { name: admin,    count: 1 }
