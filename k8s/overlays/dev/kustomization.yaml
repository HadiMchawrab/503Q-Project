apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - namespace.yaml
  - ../../base

# CI replaces `newTag` with the short Git SHA before applying.
# ECR is IMMUTABLE — `latest` is rejected on the second push, so always use a SHA.
#   kustomize edit set image shopcloud-app=$REG/shopcloud-app:$TAG
#   kustomize edit set image admin-ui=$REG/admin-ui:$TAG
images:
  - name: shopcloud-app
    newName: REPLACE_WITH_ECR_URL/shopcloud-app
    newTag: placeholder-set-by-ci
  - name: admin-ui
    newName: REPLACE_WITH_ECR_URL/admin-ui
    newTag: placeholder-set-by-ci

# CART_KEY_PREFIX namespaces Redis keys so dev and prod carts don't collide
# on the shared ElastiCache instance.
#
# All other env-specific keys (INVOICE_QUEUE_URL, Cognito IDs, etc.) are
# filled by deploy.yml via `kustomize edit add configmap --from-literal=...`.
# Those keys must NOT be pre-listed here — kustomize edit cannot replace
# existing literals, only append, and a duplicate key causes the apply to
# fail with "illegally repeats the key".
#
# Dev specifically: deploy.yml writes INVOICE_QUEUE_URL="" for dev so
# checkout's publish_invoice_event is a no-op (see shared/queue.py),
# avoiding dev orders sending real emails through the prod SQS/Lambda path.
configMapGenerator:
  - name: shopcloud-config
    behavior: merge
    literals:
      - "CART_KEY_PREFIX=cart:dev:"

# DATABASE_URL points dev pods at the shopcloud_dev database on the shared RDS.
# CI runs: kustomize edit add secret shopcloud-secrets --from-literal=DATABASE_URL=$URL
# DATABASE_URL is NOT pre-listed because `kustomize edit add secret` (in
# kustomize 5.4.x) only appends — pre-listing causes "illegally repeats the
# key" at apply. The block stays so `behavior: merge` is preserved when CI
# appends DATABASE_URL.
secretGenerator:
  - name: shopcloud-secrets
    behavior: merge
    literals: []

patches:
  - path: checkout-sa-patch.yaml
    target:
      kind: ServiceAccount
      name: checkout
  - path: admin-sa-patch.yaml
    target:
      kind: ServiceAccount
      name: admin

# Cheaper footprint in dev — single replica per service.
replicas:
  - { name: auth,     count: 1 }
  - { name: catalog,  count: 1 }
  - { name: cart,     count: 1 }
  - { name: checkout, count: 1 }
  - { name: admin,    count: 1 }
