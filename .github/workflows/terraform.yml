name: Terraform

# Infra changes follow the same branch model as app deploys:
#   - PR to main / dev → terraform plan (read-only, comments on PR)
#   - push to main     → terraform apply against the prod environment
#   - push to dev      → no auto-apply (we don't have a dev terraform env yet;
#                        if/when one is added under infra/terraform/environments/dev,
#                        wire the apply path the same way main does)
#
# Apply runs only on push to main and only when files under infra/terraform/**
# changed in the push, so app-only commits don't trigger plans.

on:
  pull_request:
    branches: [main, dev]
    paths: ["infra/terraform/**"]
  push:
    branches: [main]
    paths: ["infra/terraform/**"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write   # to comment plan output on PRs

env:
  AWS_REGION: eu-west-1
  TF_WORKING_DIR: infra/terraform/environments/prod

# Never run two applies against the same environment in parallel — terraform
# state locks via S3+DynamoDB are the safety net, but waiting in the queue
# gives clearer logs than racing for the lock.
concurrency:
  group: terraform-prod
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROLE_TO_ASSUME_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform fmt
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: terraform plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.RDS_DB_PASSWORD }}
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -out=tfplan | tee plan.txt
          {
            echo 'plan<<EOF'
            sed -n '/Terraform will perform the following actions:/,$p' plan.txt | head -c 60000
            echo
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `### Terraform plan (\`prod\`)\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${{ steps.plan.outputs.plan }}\n\`\`\`\n\n</details>`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # `prod` environment in repo settings should require manual approval.
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROLE_TO_ASSUME_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.RDS_DB_PASSWORD }}
        run: terraform apply -input=false -auto-approve
