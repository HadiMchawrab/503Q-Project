server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache immutable Vite assets (hashed filenames) for a year
    location ~* \.(?:js|css|woff2?|svg|png|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # All other paths fall through to index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
