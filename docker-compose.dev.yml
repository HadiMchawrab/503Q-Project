services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopcloud}
      POSTGRES_DB: ${POSTGRES_DB:-shopcloud}
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopcloud} -d ${POSTGRES_DB:-shopcloud}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    build: .
    command: uvicorn services.auth.main:app --host 0.0.0.0 --port 3004
    env_file: .env
    environment:
      PORT: 3004
      ROOT_PATH: /api/auth
    depends_on:
      postgres:
        condition: service_healthy

  catalog:
    build: .
    command: uvicorn services.catalog.main:app --host 0.0.0.0 --port 3001
    env_file: .env
    environment:
      PORT: 3001
      ROOT_PATH: /api/catalog
    depends_on:
      postgres:
        condition: service_healthy

  cart:
    build: .
    command: uvicorn services.cart.main:app --host 0.0.0.0 --port 3002
    env_file: .env
    environment:
      PORT: 3002
      ROOT_PATH: /api/cart
    depends_on:
      redis:
        condition: service_healthy
      catalog:
        condition: service_started

  checkout:
    build: .
    command: uvicorn services.checkout.main:app --host 0.0.0.0 --port 3003
    env_file: .env
    environment:
      PORT: 3003
      ROOT_PATH: /api/checkout
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin:
    build: .
    command: uvicorn services.admin.main:app --host 0.0.0.0 --port 3005
    env_file: .env
    environment:
      PORT: 3005
      ROOT_PATH: /api/admin
    depends_on:
      postgres:
        condition: service_healthy

  invoice-worker:
    build: .
    command: python -m services.invoice_worker.main
    env_file: .env
    volumes:
      - invoice_files:/app/invoices
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: .
    command: uvicorn web.main:app --host 0.0.0.0 --port 3000
    env_file: .env
    environment:
      PORT: 3000
    volumes:
      - invoice_files:/app/web/public/invoices:ro

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - auth
      - catalog
      - cart
      - checkout
      - admin

volumes:
  postgres_data:
  invoice_files:
