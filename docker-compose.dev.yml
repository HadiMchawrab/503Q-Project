services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopcloud}
      POSTGRES_DB: ${POSTGRES_DB:-shopcloud}
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopcloud} -d ${POSTGRES_DB:-shopcloud}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: shopcloud-auth:local
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    env_file: .env
    environment:
      PORT: 3004
      ROOT_PATH: /api/auth
    depends_on:
      postgres:
        condition: service_healthy

  catalog:
    image: shopcloud-catalog:local
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    env_file: .env
    environment:
      PORT: 3001
      ROOT_PATH: /api/catalog
    depends_on:
      postgres:
        condition: service_healthy

  cart:
    image: shopcloud-cart:local
    build:
      context: .
      dockerfile: services/cart/Dockerfile
    env_file: .env
    environment:
      PORT: 3002
      ROOT_PATH: /api/cart
    depends_on:
      redis:
        condition: service_healthy
      catalog:
        condition: service_started

  checkout:
    image: shopcloud-checkout:local
    build:
      context: .
      dockerfile: services/checkout/Dockerfile
    env_file: .env
    environment:
      PORT: 3003
      ROOT_PATH: /api/checkout
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin:
    image: shopcloud-admin:local
    build:
      context: .
      dockerfile: services/admin/Dockerfile
    env_file: .env
    environment:
      PORT: 3005
      ROOT_PATH: /api/admin
    depends_on:
      postgres:
        condition: service_healthy

  invoice-worker:
    image: shopcloud-invoice-worker:local
    build:
      context: .
      dockerfile: services/invoice_worker/Dockerfile
    env_file: .env
    volumes:
      - invoice_files:/app/invoices
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: shopcloud-web:local
    build:
      context: .
      dockerfile: web/Dockerfile
    env_file: .env
    environment:
      PORT: 3000
    volumes:
      - invoice_files:/app/web/public/invoices:ro

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - auth
      - catalog
      - cart
      - checkout
      - admin

volumes:
  postgres_data:
  invoice_files:
