server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location /api/auth/ {
        proxy_pass http://auth:3004/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/catalog/ {
        proxy_pass http://catalog:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/cart/ {
        proxy_pass http://cart:3002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/checkout/ {
        proxy_pass http://checkout:3003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Dev only — in prod, /api/admin is fronted by a separate internal ALB
    # (see k8s/base/ingress-admin.yaml). Customers cannot reach it.
    location /api/admin/ {
        proxy_pass http://admin:3005/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Storefront static assets — local dev mounts ./frontend into the gateway
    # container. In prod the same files live in S3 fronted by CloudFront, so
    # this gateway block has no production equivalent (the public ALB only
    # routes /api/*; the static origin is S3, not the cluster).
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
